name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Dézipper si besoin
        run: |
          for z in $(find . -name '*.zip' -not -path './.git/*'); do
            unzip -o -q "$z" -d "$(dirname "$z")"
          done
      - name: Build
        run: |
          S=$(find . -name 'settings.gradle*' | head -n1)
          cd "$(dirname "$S")"
          gradle assembleDebug --console=plain 2>&1 | tee build.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then echo "=== ERREURS DE COMPILATION ==="; grep -E '^e: ' build.log; exit $code; fi
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "**/build/outputs/apk/debug/*.apk"
