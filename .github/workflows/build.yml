name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        run: |
          find . -iname '*.zip' -not -path './.git/*' | while IFS= read -r z; do
            printf '%s\t%s\n' "$(git log -1 --format=%ct -- "$z")" "$z"
          done | sort -t$'\t' -k1,1n -k2,2V > /tmp/zips.txt
          echo "Zips trouvés (du plus ancien au plus récent) :"; cat /tmp/zips.txt
          newest=$(tail -n1 /tmp/zips.txt | cut -f2-)
          if [ -n "$newest" ]; then
            echo "Zip utilisé : $newest"
            rm -rf /tmp/proj; mkdir /tmp/proj
            unzip -o -q "$newest" -d /tmp/proj
            ROOT=/tmp/proj
          else
            echo "Aucun zip, utilisation du dépôt"
            ROOT=.
          fi
          S=$(find "$ROOT" -name 'settings.gradle*' | head -n1)
          if [ -z "$S" ]; then echo "ERREUR : aucun settings.gradle trouvé"; exit 1; fi
          cd "$(dirname "$S")"
          echo "Projet compilé : $(pwd)"
          gradle assembleDebug --console=plain 2>&1 | tee build.log; code=${PIPESTATUS[0]}
          if [ $code -ne 0 ]; then echo "=== ERREURS DE COMPILATION ==="; grep -E '^e: ' build.log; exit $code; fi
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app/build/outputs/apk/debug/*.apk "$GITHUB_WORKSPACE/out/"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
